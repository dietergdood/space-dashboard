<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#152f9e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Kerzen im Hintergrund -->
  <g fill="#ffffff" opacity="0.16">
    <rect x="126" y="300" width="34" height="80" rx="8"/>
    <rect x="196" y="252" width="34" height="128" rx="8"/>
    <rect x="266" y="286" width="34" height="94" rx="8"/>
    <rect x="336" y="196" width="34" height="184" rx="8"/>
  </g>
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.16">
    <line x1="143" y1="278" x2="143" y2="300"/><line x1="143" y1="380" x2="143" y2="400"/>
    <line x1="213" y1="230" x2="213" y2="252"/><line x1="213" y1="380" x2="213" y2="398"/>
    <line x1="283" y1="262" x2="283" y2="286"/><line x1="283" y1="380" x2="283" y2="398"/>
    <line x1="353" y1="172" x2="353" y2="196"/><line x1="353" y1="380" x2="353" y2="396"/>
  </g>

  <!-- Trendlinie -->
  <polyline points="118,330 205,258 272,300 386,158"
            fill="none" stroke="url(#line)" stroke-width="34"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Endpunkt -->
  <circle cx="386" cy="158" r="30" fill="#ffffff"/>
  <circle cx="386" cy="158" r="13" fill="#1d4ed8"/>

  <!-- Basislinie -->
